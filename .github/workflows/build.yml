name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  KLYX_GHP_TOKEN: ${{ secrets.KLYX_GHP_READ_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify klyx-api snapshot from GitHub Packages
        run: |
          BASE="https://maven.pkg.github.com/ulite-Amr/klyx/io/github/klyx-dev/klyx-api/4.2.0-SNAPSHOT"
          curl -s -u "ulite-Amr:$KLYX_GHP_TOKEN" "$BASE/maven-metadata.xml" | tee /tmp/meta.xml > /dev/null
          SNAPSHOT_VER=$(grep -oP '(?<=<value>)[^<]+(?=</value>)' /tmp/meta.xml | head -1)
          echo "resolved snapshot version: $SNAPSHOT_VER"
          for u in \
            "$BASE/../$SNAPSHOT_VER/klyx-api-$SNAPSHOT_VER.aar" \
            "$BASE/klyx-api-$SNAPSHOT_VER.aar" \
            "$BASE/klyx-api-4.2.0-SNAPSHOT.aar" \
            "$BASE/../$SNAPSHOT_VER/klyx-api-4.2.0-SNAPSHOT.aar" \
            "$BASE/../4.2.0-SNAPSHOT/klyx-api-$SNAPSHOT_VER.aar"; do
            echo "== $u"
            code=$(curl -s -o /tmp/probe.out -w "%{http_code}" -u "ulite-Amr:$KLYX_GHP_TOKEN" "$u")
            echo "   -> $code"
            if [ "$code" = "200" ]; then cp /tmp/probe.out /tmp/klyx-api.aar; fi
            if [ "$code" != "200" ]; then head -c 300 /tmp/probe.out; echo; fi
          done
          ls -la /tmp/klyx-api.aar
          file /tmp/klyx-api.aar
          unzip -o -q /tmp/klyx-api.aar classes.jar -d /tmp/aar || true
          unzip -p /tmp/aar/classes.jar com/klyx/api/lsp/LanguageServerProvider.class > /tmp/LSP.class 2>/dev/null || true
          strings /tmp/LSP.class | grep -i initialization || echo "METHOD NOT FOUND IN PUBLISHED JAR"

      - name: Build .klyx bundle
        run: ./gradlew :app:klyxBundleRelease --stacktrace --refresh-dependencies

      - name: Locate bundle
        id: bundle
        run: |
          BUNDLE_PATH=$(find output -name "*.klyx" -print -quit)
          if [ -z "$BUNDLE_PATH" ]; then
            echo "No .klyx file found in output/"
            exit 1
          fi
          echo "path=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$BUNDLE_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

      - name: Extract changelog notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {found=1; next}
            found && /^## / {exit}
            found {print}' CHANGELOG.md > /tmp/release_notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.path }}
          body_path: /tmp/release_notes.md
          generate_release_notes: true
