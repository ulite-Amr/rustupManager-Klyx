name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build .klyx bundle
        run: ./gradlew :app:klyxBundleRelease --stacktrace

      - name: Locate bundle
        id: bundle
        run: |
          BUNDLE_PATH=$(find output -name "*.klyx" -print -quit)
          if [ -z "$BUNDLE_PATH" ]; then
            echo "No .klyx file found in output/"
            exit 1
          fi
          echo "path=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$BUNDLE_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.path }}
          generate_release_notes: true
